[package]
name = "ai-agent"
version = "0.1.0"
edition = "2024"

[[example]]
name = "stream_chat"
path = "examples/stream_chat.rs"

[[example]]
name = "agent_run"
path = "examples/agent_run.rs"

[[example]]
name = "search_web"
path = "examples/search_web.rs"

[[example]]
name = "file_explorer"
path = "examples/file_explorer.rs"

[[example]]
name = "test_compression"
path = "examples/test_compression.rs"

[[example]]
name = "test_context_optimizer"
path = "examples/test_context_optimizer.rs"

[[example]]
name = "multi_turn"
path = "examples/multi_turn.rs"

[dependencies]
anyhow = "1.0.102"
async-openai = { version = "0.41.0", features = [
    "chat-completion",
    "embedding",
] }
async-stream = "0.3.6"
async-trait = "0.1.91"
backon = "1.6.0"
base64 = "0.23.1"
chrono = "0.4.45"
csv = "1.4.0"
dotenvy = "0.15.7"
futures = "0.3.32"
reqwest = { version = "0.13.4", features = ["json"] }
rmcp = { version = "2.2.0", features = [
    "client",
    "server",
    "macros",
    "transport-child-process",
    "transport-io",
] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiktoken-rs = "0.12.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4"] }
zip = "8.6.0"
