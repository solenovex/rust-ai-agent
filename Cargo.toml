[package]
name = "study-agent"
version = "0.1.0"
edition = "2024"
default-run = "study-agent"

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.42.0", features = ["chat-completion", "embedding"] }
async-trait = "0.1.92"
backon = "1.6.0"
base64 = "0.23.1"
calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dotenv = "0.15.0"
image = "0.25.10"
pdfium-render = "0.9.4"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.4.0", features = [
    "client",
    "server",
    "macros",
    "transport-child-process",
    "transport-io",
] }
rusqlite = { version ="0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tiktoken-rs = "0.12.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4"] }
zip = "8.6.0"
